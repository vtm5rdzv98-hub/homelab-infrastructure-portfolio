global:
  scrape_interval: 20s
  evaluation_interval: 20s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: linux_nodes
    static_configs:
      - targets: ['10.30.20.10:9100']
        labels:
          node: lab-gw
      - targets: ['10.30.20.20:9100']
        labels:
          node: lab-storage
