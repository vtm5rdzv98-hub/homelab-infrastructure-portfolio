---
- name: Verify effective SSH security configuration
  hosts: homelab_nodes
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Validate SSH configuration syntax
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      check_mode: false

    - name: Read effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_settings
      changed_when: false
      check_mode: false

    - name: Verify required security settings
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_settings.stdout_lines"
          - "'kbdinteractiveauthentication no' in ssh_settings.stdout_lines"
          - "'permitrootlogin no' in ssh_settings.stdout_lines"
          - "'pubkeyauthentication yes' in ssh_settings.stdout_lines"
        success_msg: "SSH security checks passed"

    - name: Display relevant settings
      ansible.builtin.debug:
        msg: >-
          {{ ssh_settings.stdout_lines |
             select('match',
             '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin|pubkeyauthentication) ')
             | list }}
