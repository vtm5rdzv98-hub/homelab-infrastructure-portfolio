---
- name: Verify manifest contains exactly the two expected archive entries
  ansible.builtin.command:
    argv:
      - awk
      - >-
        NF != 2 || length($1) != 64 || $1 ~ /[^0-9a-f]/ { exit 1 }
        $2 == "grafana.tar.gz" { grafana++; next }
        $2 == "prometheus.tar.gz" { prometheus++; next }
        { exit 1 }
        END { if (grafana != 1 || prometheus != 1 || NR != 2) exit 1 }
      - SHA256SUMS
    chdir: "{{ backup_root }}/{{ backup_run_id }}"
  changed_when: false

- name: Check SHA-256 for the Grafana and Prometheus archives
  ansible.builtin.command:
    argv: [sha256sum, --check, --strict, SHA256SUMS]
    chdir: "{{ backup_root }}/{{ backup_run_id }}"
  changed_when: false
