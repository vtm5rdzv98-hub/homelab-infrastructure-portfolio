name: homelab-monitoring

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    restart: unless-stopped
    pid: host
    read_only: true
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true
    # Deliberately no ports: Prometheus reaches this over the Compose network.

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
