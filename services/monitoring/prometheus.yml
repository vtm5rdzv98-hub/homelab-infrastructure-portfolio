global:
  scrape_interval: 20s
  evaluation_interval: 20s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: lab-gw
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: lab-gw

  - job_name: lab-storage
    static_configs:
      - targets: ['10.20.0.20:9100']
        labels:
          node: lab-storage

rule_files:
  - /etc/prometheus/alerts.yml
