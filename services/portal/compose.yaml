name: homelab-portal

services:
  portal:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
